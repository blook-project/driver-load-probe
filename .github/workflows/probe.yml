name: signed-driver-load
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: SPC-signed WDM driver load on windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Install WDK (NuGet content)
        shell: pwsh
        run: |
          $ver = '10.0.26100.6584'
          $dst = "$env:RUNNER_TEMP\wdk"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$ver/microsoft.windows.wdk.x64.$ver.nupkg" -OutFile "$dst\wdk.nupkg"
          tar.exe -xf "$dst\wdk.nupkg" -C $dst
          "WDK_ROOT=$dst\c" >> $env:GITHUB_ENV

      - name: Environment facts
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)"
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          "runner user: $env:USERNAME admin=$([Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          bcdedit /enum '{current}' 2>&1 | Select-String -Pattern 'testsigning|nointegritychecks|hypervisorlaunchtype|flightsigning'
          try { "SecureBoot=$((Confirm-SecureBootUEFI 2>&1))" } catch { "SecureBoot=unavailable ($($_.Exception.Message))" }
          bcdedit /enum '{current}' | Out-File "$env:RUNNER_TEMP\bcdedit.txt"

      - name: Build driver + client
        shell: pwsh
        run: |
          xmake f -c -y -m release --wdk="$env:WDK_ROOT"
          xmake -y
          Get-ChildItem build\windows\x64\release | Select-Object Name,Length

      - name: Sign driver with repo SPC signer
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -File scripts/sign-driver.ps1
          "sign_s=$([math]::Round($sw.Elapsed.TotalSeconds,1))"
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if ($signtool) { & $signtool verify /v /pa build\windows\x64\release\probe_driver.sys 2>&1; "signtool_exit=$LASTEXITCODE" }
          Get-AuthenticodeSignature build\windows\x64\release\probe_driver.sys |
            Select-Object Status,StatusMessage,@{n='Subject';e={$_.SignerCertificate.Subject}},@{n='NotAfter';e={$_.SignerCertificate.NotAfter}} | Format-List

      - name: Load driver with sc (no test signing)
        shell: pwsh
        run: |
          $sys = (Resolve-Path 'build\windows\x64\release\probe_driver.sys').Path
          sc.exe create blookprobe type= kernel binPath= "$sys" start= demand
          "create_exit=$LASTEXITCODE"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          sc.exe start blookprobe 2>&1 | Tee-Object -Variable startOut
          $startExit = $LASTEXITCODE
          "start_exit=$startExit start_s=$([math]::Round($sw.Elapsed.TotalSeconds,1))"
          $state = $null
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Milliseconds 500
            $q = sc.exe query blookprobe 2>&1 | Out-String
            if ($q -match 'STATE\s*:\s*\d+\s+RUNNING') { $state = 'RUNNING'; break }
          }
          "driver_state=$state"
          sc.exe query blookprobe | Out-String
          if ($startExit -ne 0 -or $state -ne 'RUNNING') {
            sc.exe delete blookprobe | Out-Null
            Write-Host '::error::signed driver did not start'
            exit 1
          }

      - name: Run user-mode client
        shell: pwsh
        run: |
          .\build\windows\x64\release\probe_client.exe 2>&1 | Tee-Object -Variable clientOut
          "client_exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::client failed'; exit 1 }

      - name: Stop + delete + evidence
        if: always()
        shell: pwsh
        run: |
          sc.exe stop blookprobe 2>&1 | Out-Null
          Start-Sleep -Seconds 2
          sc.exe delete blookprobe 2>&1 | Out-Null
          "final_state=$((sc.exe query blookprobe 2>&1 | Out-String))"
          try {
            Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 30 -ErrorAction Stop |
              Select-Object TimeCreated,Id,LevelDisplayName,Message | Format-List
          } catch { "codeintegrity_events_unavailable: $($_.Exception.Message)" }
          bcdedit /enum '{current}' | Out-File "$env:RUNNER_TEMP\bcdedit.txt"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-driver-load-logs
          path: |
            ${{ runner.temp }}/bcdedit.txt
          if-no-files-found: warn
