name: signed-driver-load
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: driver load probe
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Environment facts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber)"
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          "user=$($id.Name) admin=$([Security.Principal.WindowsPrincipal]::new($id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          bcdedit /enum '{current}' 2>&1 | Select-String -Pattern 'testsigning|nointegritychecks|flightsigning' | ForEach-Object { $_.Line.Trim() }
          try { "SecureBoot=$(Confirm-SecureBootUEFI 2>&1)" } catch { "SecureBoot=unavailable" }
          "sha1_spc=$((Get-FileHash artifact\probe_driver.sys -Algorithm SHA256).Hash)"
          "min_sha256=$((Get-FileHash artifact\probe_min_spc.sys -Algorithm SHA256).Hash)"
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if ($st) { & $st verify /v /pa artifact\probe_min_spc.sys 2>&1 | Select-Object -Last 8; "signtool_exit=$LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Import signing trust (TSA root + Verisign CA + XINDA leaf)
        shell: pwsh
        run: |
          certutil -addstore -f root signer\tsa\tsa-root.cer
          certutil -addstore -f CA signer\certs\verisign-cscs-2010.cer
          certutil -addstore -f CA signer\certs\verisign-g5-mcvr.cer
          $leaf = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -match 'XINDA' } | Select-Object -First 1
          if ($leaf) { certutil -addstore -f TrustedPublisher $leaf.Thumbprint }
          $st = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          & $st verify /kp /v artifact\probe_min_spc.sys 2>&1 | Select-Object -Last 12
          "kp_verify_exit=$LASTEXITCODE"
          $global:LASTEXITCODE = 0
          exit 0

      - name: Create service (SPC SHA-1 minimal driver)
        shell: pwsh
        run: |
          $sys = (Resolve-Path 'artifact\probe_min_spc.sys').Path
          $p = Start-Process -FilePath sc.exe -ArgumentList @('create','blookprobe','type=','kernel',"binPath= $sys",'start=','demand') -NoNewWindow -PassThru
          if (-not $p.WaitForExit(15000)) { $p.Kill(); "CREATE_HUNG"; exit 0 }
          "create_exit=$($p.ExitCode)"
          exit 0

      - name: Start service (guarded)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath sc.exe -ArgumentList @('start','blookprobe') -NoNewWindow -PassThru
          $finished = $p.WaitForExit(25000)
          "start_finished=$finished elapsed_s=$([math]::Round($sw.Elapsed.TotalSeconds,1)) exit=$(if ($finished) { $p.ExitCode } else { 'TIMEOUT' })"
          if (-not $finished) { try { $p.Kill() } catch {} }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Query state (guarded) + client
        shell: pwsh
        run: |
          $outFile = "$env:RUNNER_TEMP\query.txt"
          $p = Start-Process -FilePath sc.exe -ArgumentList @('query','blookprobe') -NoNewWindow -PassThru -RedirectStandardOutput $outFile
          $ok = $p.WaitForExit(15000)
          $q = if (Test-Path $outFile) { Get-Content $outFile -Raw } else { 'no query output' }
          "query_finished=$ok query=<$q>"
          "state_running=$($q -match 'STATE\s*:\s*\d+\s+RUNNING')"
          if (-not $ok) { try { $p.Kill() } catch {} }
          $global:LASTEXITCODE = 0
          if ($q -match 'STATE\s*:\s*\d+\s+RUNNING') {
            .\artifact\probe_client.exe 2>&1 | ForEach-Object { $_ }
            "client_exit=$LASTEXITCODE"
          } else { "client_skipped" }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Stop + delete + evidence
        if: always()
        shell: pwsh
        run: |
          foreach ($action in @('stop','delete')) {
            $p = Start-Process -FilePath sc.exe -ArgumentList @($action,'blookprobe') -NoNewWindow -PassThru
            $fin = $p.WaitForExit(10000)
            if (-not $fin) { try { $p.Kill() } catch {} }
            "sc_$action finished=$fin"
          }
          try { Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 8 -ErrorAction Stop |
                  Select-Object TimeCreated,Id,LevelDisplayName | Format-Table | Out-String } catch { "codeintegrity_unavailable" }
          $global:LASTEXITCODE = 0
          exit 0


